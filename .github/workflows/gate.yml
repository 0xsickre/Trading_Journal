# Gate — dogovor pretvoren u prepreku.
#
# Do Koraka 11 ovaj projekat nije imao CI. Provere su se vrtele pred svaki
# commit zato što je tako DOGOVORENO, a dogovor ne obara pull request. Ovaj
# fajl to menja: iste provere, istim redosledom, na svakom push-u i svakom PR-u.
#
# Redosled nije proizvoljan — ide od najbržeg ka najskupljem, pa greška pada za
# sekunde umesto za minute:
#
#   typecheck     ~10 s   hvata najveći deo izmena koje ne stoje
#   scan          ~2 s    bajtovi: NUL, nevalidan JSON, .only, console.log
#   schema:check  ~1 s    zapis baznih tabela protiv generisanih tipova
#   test          ~60 s   2407 tvrdnji, uključujući podove pokrivenosti
#   lint          ~20 s   nula problema, bez izuzetka
#   build         ~60 s   jedino mesto koje izvršava Next-ov compiler
#   dead (knip)   ~20 s   nula mrtvih fajlova, zavisnosti i export-a
#
# `scan` i `schema:check` su ispred testova namerno: oba traju sekundu, a hvataju
# klasu grešaka koju nijedna druga provera ne vidi — `scan` gleda bajtove umesto
# značenja, `schema:check` poredi `supabase/schema/production_base_tables.sql`
# sa `src/lib/supabase/types.ts` i pada kad zapis zaostane za bazom.
#
# `--frozen-lockfile` preko `npm ci`: build koji sme da promeni lockfile nije
# isti build koji je čovek pokrenuo lokalno.

name: gate

on:
  push:
    branches: [main]
  pull_request:

# Novi push na istu granu otkazuje prethodni prolaz. Bez ovoga tri commit-a u
# minuti drže tri runnera na poslu koji je već zastareo.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Build traži ove dve promenljive da bi Next mogao da napravi Supabase
    # klijenta. Obe su JAVNE po projektu (anon ključ ne daje pristup sam po
    # sebi — svaki red je iza RLS-a), pa stoje kao repo varijable, ne tajne.
    # Ako nisu podešene, korak build ispod to kaže rečenicom umesto da padne na
    # nerazumljivoj grešci iz Next-a.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: scan (bajtovi, ne značenje)
        run: npm run scan

      - name: schema:check (zapis baznih tabela protiv baze)
        run: npm run schema:check

      - name: test
        run: npx vitest run --coverage

      # ESLint izlazi sa 0 i na warning-ima, pa `npm run lint` sam po sebi ne
      # čuva ništa — broj se mora izmeriti.
      #
      # Prag je NULA. Do sada je bio „tačno 1", zbog poruke React Compiler-a o
      # TanStack Table-u u `journal-grid.tsx`. Ta poruka je tačna i trajna — ne
      # može se ukloniti bez odustajanja od biblioteke — pa je ućutkana na licu
      # mesta, sa zapisanim razlogom, umesto da se toleriše ovde. Razlika je u
      # tome što izuzetak sada stoji pored koda na koji se odnosi, a ne u CI
      # fajlu koji niko ne čita dok ne pukne.
      - name: lint (nula problema)
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log || true
          # Obrazac je čist ASCII namerno: ESLint-ov sažetak počinje glifom
          # koji mora da preživi runner, locale i pipe da bi provera važila.
          # Provera koja ume tiho da prestane da važi nije provera.
          if grep -qE "[0-9]+ problems? \([0-9]+ error" /tmp/lint.log; then
            echo "::error::ESLint je prijavio probleme. Vidi /tmp/lint.log."
            exit 1
          fi

      - name: build
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Nedostaju repo varijable NEXT_PUBLIC_SUPABASE_URL i/ili NEXT_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          npm run build

      # Prag je i ovde NULA, na sve tri vrste nalaza.
      #
      # Ranije je tolerisao neiskorišćene EXPORT-e, kojih je bilo 22 — svi
      # re-export-i iz shadcn/ui komponenti koje ništa ne uvozi. Obrisani su, pa
      # tolerancija više nema šta da pokriva; a spisak koji uvek ima 22 stavke je
      # spisak u koji se prestane gledati, i tako je 23. prošla neopaženo.
      - name: dead (knip)
        run: npm run dead
